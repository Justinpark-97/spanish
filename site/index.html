<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EL PAÍS 영어 뉴스에서 매일 배우는 영어 단어 20개와 한국어 뜻">
  <title>Daily Words — 오늘의 영어 20</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#19332c;background:#f5f3ec}
    *{box-sizing:border-box}body{max-width:1020px;margin:auto;padding:48px 24px}
    header{border-top:5px solid #234b3d;padding-top:22px}.eyebrow{letter-spacing:.16em;font-size:12px;font-weight:700}
    h1{font-size:clamp(36px,7vw,64px);letter-spacing:-.05em;margin:22px 0 12px}
    .intro{color:#53645c;line-height:1.8} .meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:24px 0 32px}
    #status{font-size:14px;line-height:1.6;flex:1}button{border:1px solid #234b3d;border-radius:24px;padding:10px 18px;background:transparent;color:inherit;cursor:pointer}
    button:hover{background:#e4e9df}button:focus-visible,a:focus-visible{outline:3px solid #b37426;outline-offset:4px}
    #words{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    article{background:#fffef9;border:1px solid #dedfd4;border-radius:12px;padding:24px;min-width:0}
    .number{font-size:12px;color:#7a8377}h2{font-size:25px;overflow-wrap:anywhere;margin:12px 0}.meaning{line-height:1.6;min-height:2em;color:#53645c}
    a{color:#366f55;font-size:13px;text-underline-offset:4px}footer{margin-top:40px;padding-top:20px;border-top:1px solid #d4d8cc;color:#68766c;font-size:13px;line-height:1.8}
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">DAILY WORDS / EL PAÍS ENGLISH</div>
    <h1>뉴스로 여는 하루,<br>오늘의 영어 20.</h1>
    <p class="intro">세상의 소식을 읽고, 새로운 단어를 만납니다.<br>영어 뉴스의 단어와 문맥에 맞는 한국어 뜻을 매일 모아드립니다.</p>
  </header>
  <div class="meta">
    <p id="status" role="status" aria-live="polite">오늘의 단어를 불러오는 중입니다.</p>
    <button id="reload" type="button">최신 데이터 확인 ↻</button>
  </div>
  <main id="words" aria-label="오늘의 영어 단어"></main>
  <footer>매일 오전 8시(한국 시간) 자동 실행 예약 · 처리와 배포에 따라 갱신이 늦어질 수 있습니다.<br>
    출처: <a href="https://english.elpais.com/">EL PAÍS English</a> · AI 번역에는 오류가 있을 수 있습니다. 원문 기사를 함께 확인하세요.<br>
    <a href="https://github.com/Justinpark-97/spanish">프로젝트와 실행 기록</a>
  </footer>
  <script src="app.js"></script>
</body>
</html>
